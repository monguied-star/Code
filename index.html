<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:15px;
background:#f4f6f8;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,select,button{
width:100%;
padding:10px;
margin-top:8px;
box-sizing:border-box;
}

button{
background:#0078d4;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

.kpis{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.kpi{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
}
</style>
</head>

<body>

<h2>💰 Mis Finanzas</h2>

<div class="kpis">
<div class="kpi">
<h4>Ingresos</h4>
<span id="totalIngresos">$0</span>
</div>

<div class="kpi">
<h4>Egresos</h4>
<span id="totalEgresos">$0</span>
</div>

<div class="kpi">
<h4>Saldo</h4>
<span id="saldo">$0</span>
</div>

<div class="kpi">
<h4>Movimientos</h4>
<span id="cantidad">0</span>
</div>
</div>

<div class="card">

<h3>Nuevo Movimiento</h3>

<input type="date" id="fecha">

<select id="tipo">
<option>Ingreso</option>
<option>Egreso</option>
</select>

<input
id="categoria"
placeholder="Categoría">

<select id="medioPago">
<option>Efectivo</option>
<option>Nequi</option>
<option>Daviplata</option>
<option>Débito</option>
<option>Crédito</option>
</select>

<input
type="number"
id="valor"
placeholder="Valor">

<input
id="descripcion"
placeholder="Descripción">

<button onclick="guardarRegistro()">
Guardar
</button>

</div>

<div class="card">

<button onclick="exportarExcel()">
Exportar Excel
</button>

<br><br>

<input
type="file"
accept=".xlsx"
onchange="importarExcel(event)">

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">

<h3>Movimientos</h3>

<table>
<thead>
<tr>
<th>Fecha</th>
<th>Tipo</th>
<th>Valor</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>
</table>

</div>

</body>
</html>
